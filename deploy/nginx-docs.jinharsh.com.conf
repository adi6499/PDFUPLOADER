# Sample nginx site for Jinharsh Docs on aaPanel. aaPanel's SSL page adds the certificate lines.
server {
    listen 80;
    listen 443 ssl http2;
    server_name docs.jinharsh.com;

    # PDFs up to 150 MB (nginx would refuse anything over 1 MB without this)
    client_max_body_size 160m;

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # real upload progress in the app
        proxy_buffering off;           # PDFs stream straight to the reader
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    access_log /www/wwwlogs/docs.jinharsh.com.log;
    error_log  /www/wwwlogs/docs.jinharsh.com.error.log;
}
