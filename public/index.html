<!doctype html>
<html class="ju" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jinharsh Catalogues · Read online or download</title>
  <meta name="description" content="Every Jinharsh Industrial Solutions product catalogue in one place: bearings, couplings, motors, lubrication, safety and more. Read online or download.">

  <meta property="og:title" content="Jinharsh Catalogues">
  <meta property="og:description" content="Every Jinharsh product catalogue in one place. Read online or download.">
  <meta property="og:image" content="https://catalog.jinharsh.com/assets/icon-512.png">
  <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/vendor/fonts/Geist-Latin.woff2" as="font" type="font/woff2" crossorigin>
  <!--PRELOAD-->
  <!-- every script the page needs, fetched side by side instead of one after another -->
  <link rel="modulepreload" href="/js/hub.js">
  <link rel="modulepreload" href="/js/site.js">
  <link rel="modulepreload" href="/js/motion.js">
  <link rel="modulepreload" href="/js/particles.js">
  <link rel="modulepreload" href="/js/qr.js">
  <link rel="modulepreload" href="/js/copy.js">
  <link rel="modulepreload" href="/js/pdfkit.js">
  <link rel="modulepreload" href="/vendor/qrcode.mjs">
  <link rel="modulepreload" href="/vendor/icons.js">
  <link rel="modulepreload" href="/js/handoff.js">
  <link rel="stylesheet" href="/vendor/jinharsh-ui.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/view.css">
  <link rel="stylesheet" href="/css/hub.css">
  <script src="/vendor/jinharsh-ui.js"></script>
</head>
<body class="viewer hub">
  <header class="ju-top ju-glass" data-ju-lens="flat">
    <div class="top-in">
      <a class="brand" href="/">
        <img src="/assets/mark-96.png" alt="" width="38" height="38">
        <span><b>Jinharsh</b><small>Catalogues</small></span>
      </a>
      <button class="ju-btn accent sm hub-upload" id="hubUpload" type="button" hidden></button>
      <button class="ju-icon" id="hubQr" type="button" aria-label="QR code for this page" title="QR code for this page"></button>
      <button class="ju-icon" id="themeTop" type="button" aria-label="Light or dark" title="Light or dark"></button>
      <button class="ju-icon" id="hubShare" type="button" aria-label="Share" title="Share"></button>
    </div>
  </header>
  <input type="file" id="hubFile" accept="application/pdf,.pdf" multiple hidden>
  <div class="drop-veil" id="dropVeil" hidden><div class="card"><span id="dropIcon"></span><b>Drop to upload</b><span class="ju-muted">PDF files only</span></div></div>
  <main class="vwrap" id="app">
    <section class="hub-hero">
      <div class="ju-eyebrow" id="hubEyebrow">Jinharsh Industrial Solutions</div>
      <h1>Catalogues</h1>
      <p class="lead">Every product catalogue in one place. Read it online, download it, or share it.</p>
      <label class="hub-search">
        <span class="sr">Search catalogues</span>
        <span id="searchIcon"></span>
        <input id="q" type="search" placeholder="Search: bearings, couplings, Timken…" autocomplete="off">
      </label>
    </section>
    <div class="chips" id="chips" role="group" aria-label="Brands"></div>
    <section class="cards" id="cards" aria-live="polite"></section>
    <div id="contact"></div>
  </main>
  <!--DATA-->
  <script type="module" src="/js/hub.js"></script>
</body>
</html>
